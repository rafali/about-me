<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photos Admin</title>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.10.0/mapbox-gl.css" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <main id="app" class="app">
        <aside class="sidebar">
            <header class="sidebar-header">
                <h1>Photos</h1>
                <button id="syncButton" type="button" class="sync-button">Sync Instagram</button>
                <select id="statusFilter" aria-label="Filter posts">
                    <option value="all">All</option>
                    <option value="missing-geo">Missing geo</option>
                    <option value="missing-map">Missing map</option>
                    <option value="mapped">Mapped</option>
                </select>
            </header>
            <div id="postList" class="post-list"></div>
        </aside>

        <section class="detail">
            <div id="emptyState" class="empty-state">Select a post</div>
            <article id="editor" class="editor" hidden>
                <header class="editor-header">
                    <div>
                        <h2 id="postTitle"></h2>
                        <p id="postMeta"></p>
                    </div>
                    <a id="postLink" href="#" target="_blank" rel="noreferrer">Open</a>
                </header>

                <div class="workspace">
                    <section class="geo-editor">
                        <div class="geo-grid">
                            <label>
                                <span>Name</span>
                                <input id="geoName" type="text" autocomplete="off">
                            </label>
                            <label>
                                <span>Lat</span>
                                <input id="geoLat" type="number" step="0.000001">
                            </label>
                            <label>
                                <span>Lon</span>
                                <input id="geoLon" type="number" step="0.000001">
                            </label>
                            <label>
                                <span>Zoom</span>
                                <input id="geoZoom" type="number" min="1" max="18" step="0.1">
                            </label>
                        </div>
                        <div class="coord-paste">
                            <label>
                                <span>Coordinates / URL</span>
                                <input id="coordPaste" type="text" autocomplete="off">
                            </label>
                            <button id="useCoordPaste" type="button">Use</button>
                        </div>
                        <div id="geoResults" class="geo-results" hidden></div>
                        <div id="map" class="map"></div>
                        <div id="mapPreview" class="map-preview"></div>
                        <div class="actions">
                            <button id="saveGeo" type="button">Save geo</button>
                            <button id="generateMap" type="button">Generate map</button>
                            <button id="saveAndGenerate" type="button">Save + generate</button>
                        </div>
                        <p id="message" class="message"></p>
                    </section>

                    <section class="preview">
                        <div id="mediaPreview" class="media-preview"></div>
                    </section>
                </div>
            </article>
        </section>
    </main>

    <script src="https://api.mapbox.com/mapbox-gl-js/v3.10.0/mapbox-gl.js"></script>
    <script src="admin.js"></script>
</body>
</html>
