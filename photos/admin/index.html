<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photos Admin</title>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.10.0/mapbox-gl.css" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <header class="toolbar">
        <div class="toolbar-content">
            <h1>Photos Admin</h1>
            <div class="toolbar-actions">
                <button id="syncButton" type="button" class="btn-sync">Sync Instagram</button>
                <button id="previewButton" type="button" class="btn-preview">Preview Site</button>
                <button id="publishButton" type="button" class="btn-publish">Publish</button>
            </div>
        </div>
    </header>

    <main id="app" class="app">
        <aside class="sidebar">
            <header class="sidebar-header">
                <select id="statusFilter" aria-label="Filter posts">
                    <option value="all">All</option>
                    <option value="missing-geo">Missing geo</option>
                    <option value="missing-map">Missing map</option>
                    <option value="mapped">Mapped</option>
                </select>
            </header>
            <div id="postList" class="post-list"></div>
        </aside>

        <section class="detail">
            <div id="emptyState" class="empty-state">Select a post</div>
            <article id="editor" class="editor" hidden>
                <header class="editor-header">
                    <div>
                        <h2 id="postTitle"></h2>
                        <p id="postMeta"></p>
                    </div>
                    <a id="postLink" href="#" target="_blank" rel="noreferrer">Open</a>
                </header>

                <div class="caption-editor">
                    <label>
                        <span>Caption</span>
                        <textarea id="postCaption" autocomplete="off" placeholder="Post caption..."></textarea>
                    </label>
                    <button id="saveCaption" type="button">Save caption</button>
                </div>

                <div class="workspace">
                    <section class="geo-editor">
                        <div class="geo-grid">
                            <label>
                                <span>Name</span>
                                <input id="geoName" type="text" autocomplete="off">
                            </label>
                            <label>
                                <span>Lat</span>
                                <input id="geoLat" type="number" step="0.000001">
                            </label>
                            <label>
                                <span>Lon</span>
                                <input id="geoLon" type="number" step="0.000001">
                            </label>
                            <label>
                                <span>Zoom</span>
                                <input id="geoZoom" type="number" min="1" max="18" step="0.1">
                            </label>
                        </div>
                        <div class="coord-paste">
                            <label>
                                <span>Coordinates / URL</span>
                                <input id="coordPaste" type="text" autocomplete="off">
                            </label>
                            <button id="useCoordPaste" type="button">Use</button>
                        </div>
                        <div id="geoResults" class="geo-results" hidden></div>
                        <div id="map" class="map"></div>
                        <div id="mapPreview" class="map-preview"></div>
                        <div class="actions">
                            <button id="saveGeo" type="button">Save geo</button>
                            <button id="generateMap" type="button">Generate map</button>
                            <button id="saveAndGenerate" type="button">Save + generate</button>
                        </div>
                        <p id="message" class="message"></p>
                    </section>

                    <section class="preview">
                        <img id="mediaMain" class="media-preview-main" alt="" hidden>
                        <div id="mediaPreview" class="media-preview-gallery"></div>
                    </section>
                </div>
            </article>
        </section>
    </main>

    <div id="publishModal" class="modal" hidden>
        <div class="modal-content">
            <div class="modal-header">
                <h2>Publish Changes</h2>
                <button type="button" class="modal-close" id="closePublish">&times;</button>
            </div>
            <div class="modal-body">
                <div id="gitStatus" class="git-status"></div>
                <div class="commit-form">
                    <label>
                        <span>Commit message</span>
                        <textarea id="commitMessage" placeholder="Describe your changes..." rows="3"></textarea>
                    </label>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" id="cancelPublish" class="btn-cancel">Cancel</button>
                <button type="button" id="confirmPublish" class="btn-confirm">Commit & Push</button>
            </div>
        </div>
    </div>

    <div id="tokenModal" class="modal" hidden>
        <div class="modal-content">
            <div class="modal-header">
                <h2>Instagram Token Required</h2>
                <button type="button" class="modal-close" id="closeToken">&times;</button>
            </div>
            <div class="modal-body">
                <p id="tokenError" style="color: #d32f2f; margin-bottom: 16px;"></p>
                <label>
                    <span>Instagram Graph API Token</span>
                    <textarea id="instaToken" placeholder="Paste your Instagram token here..." rows="4" style="font-family: monospace; font-size: 12px;"></textarea>
                </label>
                <p style="color: #687365; font-size: 12px; margin-top: 12px;">
                    Get your token from <a href="https://developers.facebook.com/" target="_blank" style="color: #245a92;">Facebook Developers</a>
                </p>
            </div>
            <div class="modal-footer">
                <button type="button" id="cancelToken" class="btn-cancel">Cancel</button>
                <button type="button" id="confirmToken" class="btn-confirm">Save & Retry</button>
            </div>
        </div>
    </div>

    <script src="https://api.mapbox.com/mapbox-gl-js/v3.10.0/mapbox-gl.js"></script>
    <script src="admin.js"></script>
</body>
</html>
